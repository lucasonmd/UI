<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="author" content="SW Team(Land) Sangjun Choi">
<meta name="copyright" content="Hanwha Systems">
<!-- GVA HMI 화면설계서 도구
     Copyright Hanwha Systems
     제작 : SW Team(Land) Sangjun Choi -->
<title>GVA HMI 화면설계서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!-- D2Coding : 한글이 들어간 고정폭 글꼴 (숫자·코드·상태값). 오프라인이면 Consolas + 맑은 고딕 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/joungkyun/font-d2coding/d2coding.css">
<style>
/* ============================================================
   GVA HMI 화면설계서 — 에디터 겸 뷰어 (단일 파일)

   Core 외형은 src/GVA.HMI.Example.Core (CoreUiBuilder.cs / GvaColors.xaml /
   GvaStyles.xaml / StatusBarView.xaml) 를 그대로 옮긴 것이다. 치수·색을 바꿀
   일이 생기면 그쪽을 먼저 보고 여기 [1] 토큰과 coreDefault() 를 맞춘다.

   [1] 토큰  [2] 문서 골격  [3] 트리  [4] Core 외형  [5] 페이지 요소
   [6] (설명은 전부 오른쪽 패널)  [7] 속성 패널  [8] 반응형  [9] 인쇄
   ============================================================ */

/* ---------- [1] 토큰 ---------- */
:root{
  /* 설계서 UI(문서 크롬) */
  /* 색 체계 — Radix Colors (Slate 중립 + Blue 강조)  https://www.radix-ui.com/colors
     단계 용도 : 1~2 배경 · 3~5 요소 배경(기본/호버/선택) · 6~8 테두리·포커스
                 9~10 진한 단색 · 11~12 글자
     원칙 : 선택·주요 버튼은 9단계로 칠하지 않는다. 3~5단계 옅은 배경 + 11단계 글자 + 7단계 테두리. */
  --gray1:#fcfcfd; --gray2:#f9f9fb; --gray3:#f0f0f3; --gray4:#e8e8ec; --gray5:#e0e1e6; --gray6:#d9d9e0;
  --gray7:#cdced6; --gray8:#b9bbc6; --gray9:#8b8d98; --gray10:#80838d; --gray11:#60646c; --gray12:#1c2024;
  --blue1:#fbfdff; --blue2:#f4faff; --blue3:#e6f4fe; --blue4:#d5efff; --blue5:#c2e5ff; --blue6:#acd8fc;
  --blue7:#8ec8f6; --blue8:#5eb1ef; --blue9:#0090ff; --blue10:#0588f0; --blue11:#0d74ce; --blue12:#113264;
  --paper:var(--gray2); --panel:#ffffff; --panel2:var(--gray3);
  --ink:var(--gray12); --sub:var(--gray11); --line:var(--gray6); --line2:var(--gray4);
  --accent:var(--blue11); --accent-ink:var(--blue12); --hot:var(--blue8); --danger:#ce2c31;
  --tool:var(--blue9);          /* 편집 도구 : 선택·손잡이·안내선 */
  --mono:ui-monospace,"Cascadia Mono",Consolas,"D2 coding","Malgun Gothic",monospace;   /* 한글은 D2Coding 으로 */
  --gva:"Segoe UI","Malgun Gothic",Inter,Arial,sans-serif;

  /* HMI Core 팔레트 — GvaColors.xaml */
  --void:#000000;
  --chassis-hi:#1A1B1E; --chassis-lo:#101012;
  --surface-hi:#232326; --surface-lo:#1A1A1D; --surface-off:#141416;
  --fg:#F2F2F2; --fg-dim:#8A9096; --fg-off:#4E4E52;
  --hmi:#00C8FF; --hmi-deep:#0098D4; --hmi-fg:#EAF9FF;
  --sel-hi:#0C3A4B; --sel-lo:#082530;
  --warn:#FF453A; --caut:#FFB300; --ok:#32D74B;
  --hairline:rgba(255,255,255,.07); --seam:rgba(255,255,255,.12);
  --engrave:rgba(0,0,0,.14);
  --zone-hi:#191A1E; --zone-lo:#141519;
  --zone-edge:rgba(255,255,255,.10); --divider:rgba(255,255,255,.08);
  --status-label:#98A0A8; --status-value:#DCE1E6;
  --label-dis:#34373B;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-size:14.5px;line-height:1.55;
  font-family:"Pretendard Variable",Pretendard,"Malgun Gothic","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hot);outline-offset:1px}
*{scrollbar-width:thin;scrollbar-color:var(--gray7) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--gray6);border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background-color:var(--gray8)}
::-webkit-scrollbar-track{background:transparent}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;font-weight:500;
  padding:5px 11px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:var(--gray2);border-color:var(--gray8)}
.btn[aria-pressed="true"],
.btn.pri{background:var(--blue3);border-color:var(--blue7);color:var(--blue11);font-weight:600}
.btn[aria-pressed="true"]:hover,
.btn.pri:hover{background:var(--blue4);border-color:var(--blue8)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#0000000d}
.btn.warnbtn:hover{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:0 9px;height:26px;font-size:12.5px}
#bar .btn{height:32px;padding-top:0;padding-bottom:0}
.sep{width:1px;height:20px;background:var(--line);flex:none}
.spacer{flex:1}
input[type=text],input[type=number],select,textarea{
  border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:5px 8px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue8);outline:none;box-shadow:0 0 0 3px var(--blue4)}
textarea{resize:vertical;min-height:62px;line-height:1.55}
input:disabled,textarea:disabled,select:disabled{background:var(--panel2);color:var(--sub)}
input[type=color]{padding:0;height:26px;border:1px solid var(--line);border-radius:5px;background:none;cursor:pointer}
.chk{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.chk input{width:auto}
code{font-family:var(--mono);font-size:12px}
kbd{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;
  border-radius:4px;padding:0 4px;background:var(--panel2)}

/* ---------- [2] 문서 골격 ---------- */
#shell{display:grid;height:100%;
  grid-template-columns:var(--tw,var(--tw-user,256px)) minmax(0,1fr) var(--iw,var(--iw-user,380px));
  grid-template-rows:auto minmax(0,1fr)}
#bar{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:8px 14px;
  background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;
  box-shadow:0 1px 3px rgba(0,0,0,.06);position:relative;z-index:5}
/* 보기 | 편집 전환 스위치 */
.seg{display:inline-flex}
.seg .btn{border-radius:0}
.seg .btn:first-child{border-radius:6px 0 0 6px}
.seg .btn:last-child{border-radius:0 6px 6px 0;margin-left:-1px}
.seg .btn[aria-pressed="true"]{position:relative;z-index:1}
#docTitle{width:auto;min-width:200px;max-width:380px;border-color:transparent;background:transparent;
  font-size:14.5px;font-weight:700;letter-spacing:-.02em}
#docTitle:hover,#docTitle:focus{border-color:var(--line);background:var(--panel)}
body.dirty #saveBtn::after{content:"\25CF";color:var(--hot);font-size:10px}
.tabbar{display:none;gap:4px}
#treeToggle{display:none}
body:not(.editing) .ed{display:none!important}
body.tree-hide{--tw:0px}
body.tree-hide #treePane{display:none}
body.insp-hide{--iw:0px}
body.insp-hide #inspPane{display:none}

/* ---------- [3] 트리 ---------- */
#treePane{background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;position:relative}
/* 패널 너비 조절 경계 — 끌어서 조절, 두 번 누르면 기본값 */
.gut{position:absolute;top:0;bottom:0;width:9px;z-index:12;cursor:col-resize;touch-action:none}
#gutL{right:-5px}
#gutR{left:-5px}
.gut::after{content:"";position:absolute;top:0;bottom:0;left:4px;width:1px;background:transparent;transition:background-color .12s}
.gut:hover::after,.gut.on::after{background:var(--blue8);width:3px;left:3px}
body.resizing,body.resizing *{cursor:col-resize!important;user-select:none!important}
.paneHead{display:flex;align-items:center;gap:4px;padding:9px 11px;border-bottom:1px solid var(--line2);
  font-size:12px;letter-spacing:.1em;color:#34424a;text-transform:uppercase;font-weight:700}
#treeBox{overflow:auto;padding:8px 9px 20px;flex:1}

/* 기능영역 그룹 머리 — 트리 최상위 구분 */
.synced{margin:2px 0 6px;padding:8px 10px;border:1px solid var(--blue6);background:var(--blue2);border-radius:6px;font-size:12px}
.synced b{color:var(--blue11)}
.synced ul{margin:4px 0 6px 16px;color:var(--gray11)}
.tgroup{display:flex;align-items:center;gap:8px;margin:14px 0 6px;padding:5px 8px;border-radius:6px;
  background:var(--panel2);border:1px solid var(--line2);cursor:pointer}
.tgroup:first-child{margin-top:0}
.tgroup .gk{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--accent);letter-spacing:.05em}
.tgroup .gn{font-size:13.5px;font-weight:700}
.tgroup .gx{margin-left:auto;font-size:10px;color:var(--sub);border:1px solid var(--line);
  border-radius:99px;padding:0 6px}
.tgroup.on{background:var(--blue3);border-color:var(--blue6)}
.tgroup.on .gk{color:var(--blue11)}
.tgroup.off .gk,.tgroup.off .gn{opacity:.45}
.tgroup.off{border-style:dashed}
/* 실행 / 미실행 전환 (편집 모드) — 보기 모드에서는 '미실행' 표시만 */
.tgroup .guse{height:20px;padding:0 7px;border-radius:99px;cursor:pointer;font:600 10.5px/18px inherit;
  border:1px solid var(--gray7);background:#fff;color:var(--gray11);white-space:nowrap}
.tgroup .guse.on{border-color:var(--green7,#8eceaa);background:var(--green3,#e9f6ee);color:var(--green11,#218358)}
.tgroup .guse:hover{border-color:var(--gray9)}
body.editing .tgroup .gx{display:none}
.tgroup.misc{background:transparent;border-style:dashed}
.tgroup.doc{background:var(--gray2);border-color:var(--gray5);cursor:default}
.tempty{font-size:12px;color:var(--sub);padding:5px 8px 6px 16px;border-radius:6px;border:1px dashed transparent}
body.editing .tempty{border-color:var(--gray6)}
.tgroup .tadd{margin-left:auto;width:22px;height:22px;padding:0;border-radius:6px;cursor:pointer;flex:none;
  border:1px solid var(--blue7);background:var(--blue3);color:var(--blue11);font:700 15px/1 inherit;
  display:grid;place-items:center}
.tgroup .tadd:hover{background:var(--blue4);border-color:var(--blue8)}
.tgroup .gx+.tadd{margin-left:6px}
.tgroup .gr{margin-left:auto;display:flex;align-items:center;gap:6px}
.tgroup .gr .gx,.tgroup .gr .tadd{margin-left:0}
.tgroup .gc{min-width:20px;height:18px;padding:0 6px;border-radius:99px;background:var(--gray4);
  color:var(--gray11);font:600 11px/18px var(--mono);text-align:center}
.tgroup.on .gc{background:var(--blue5);color:var(--blue12)}
/* 전시기 탭 (승무원 임무) */
#roleTabs{display:flex;align-items:flex-end;gap:2px;padding:6px 10px 0;background:var(--gray2);
  border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.rtab{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border:1px solid transparent;
  border-bottom:0;border-radius:8px 8px 0 0;background:transparent;color:var(--gray11);font-weight:600;
  font-size:13.5px;cursor:pointer;margin-bottom:-1px;white-space:nowrap}
.rtab:hover{background:var(--gray3);color:var(--gray12)}
.rtab.drop-in{background:var(--blue3);box-shadow:inset 0 0 0 2px var(--blue8);color:var(--blue11)}
.rtab.on{background:#fff;border-color:var(--line);color:var(--gray12);box-shadow:inset 0 2px 0 var(--blue9)}
.rtab .rc{font:600 10.5px/1 var(--mono);color:var(--gray10);background:var(--gray3);border-radius:4px;padding:3px 5px}
.rtab.on .rc{background:var(--blue3);color:var(--blue11)}
.rtab .rx{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font-size:10px;color:var(--gray9)}
.rtab .rx:hover{background:#fff0ef;color:#ce2c31}
.rtab.radd{color:var(--blue11)}
.rhint{margin-left:auto;align-self:center;font-size:11.5px;color:var(--gray10);padding:0 4px 6px;white-space:nowrap}
.paneHead .ph-role{margin-left:auto;font-size:11px;letter-spacing:0;text-transform:none;font-weight:600;
  color:var(--blue11);background:var(--blue3);border:1px solid var(--blue6);border-radius:4px;padding:1px 6px}
.addRow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 10px;border-bottom:1px solid var(--line2)}
.addRow .btn{justify-content:center}
.tgroup.drop-in,.tempty.drop-in{background:var(--blue3);box-shadow:inset 0 0 0 2px var(--blue8)}

/* 트리 들여쓰기 — 안내선 없이 여백으로만 */
.tw,.tw ul{list-style:none}
.tw ul{margin-left:0;padding-left:15px}
.tw li{position:relative}
.ti{display:flex;align-items:center;gap:5px;border-radius:6px;padding:4px 7px 4px 2px;
  cursor:pointer;min-height:27px}
.ti:hover{background:var(--gray3)}
.ti.on{background:var(--blue4);color:var(--blue12);font-weight:600;box-shadow:inset 3px 0 0 var(--blue9)}
.ti.on .tcode{color:var(--blue11)}
.ti.on .tsys{background:var(--blue6);color:var(--blue12)}
.tcaret{width:16px;height:16px;flex:none;border:0;background:none;cursor:pointer;color:var(--sub);
  display:grid;place-items:center;font-size:10px}
.ti.on .tcaret{color:var(--blue11)}
.tcaret.leaf{visibility:hidden}
.tname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.tcode{font-family:var(--mono);font-size:10.5px;color:var(--sub);flex:none}
.tsys{font-size:10.5px;border-radius:99px;padding:0 7px;background:var(--gray4);color:var(--gray11);flex:none;font-weight:700}
.ti.drop-in{box-shadow:inset 0 0 0 2px var(--hot)}

/* ---------- [4] Core 외형 ---------- */
#stagePane{display:flex;flex-direction:column;min-width:0;min-height:0;background:#ffffff;position:relative}
/* 디자인 버전 전환 — 전시영역 좌측 하단에 흐리게. 올리면 보인다 */
#designBtn{position:absolute;left:8px;bottom:6px;z-index:6;padding:2px 6px;border:1px solid transparent;
  border-radius:4px;background:transparent;color:var(--gray8);font:600 10px/1.4 var(--mono);
  letter-spacing:.1em;cursor:pointer;opacity:.45}
#designBtn:hover{opacity:1;color:var(--gray11);border-color:var(--gray6);background:#fff}
/* 저작권 — 전시영역 오른쪽 아래, 눈에 띄지 않게 */
#copyMark{position:absolute;right:10px;bottom:6px;z-index:6;color:var(--gray10);opacity:.9;
  font:300 11.5px/1.4 var(--mono);letter-spacing:.08em;pointer-events:none;user-select:none}
#stageBar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line2);
  background:var(--panel);flex-wrap:wrap}
/* 도구줄 토글 칩 — 체크박스는 숨기고 칩 전체가 눌린다 */
#stageBar .chk{height:26px;padding:0 11px;border:1px solid var(--gray6);border-radius:99px;background:#fff;
  color:var(--gray11);position:relative;transition:background-color .12s,border-color .12s}
#stageBar .chk input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
#stageBar .chk:hover{border-color:var(--gray8)}
#stageBar .chk:has(input:checked){background:var(--blue3);border-color:var(--blue7);color:var(--blue11);font-weight:600}
#stageBar .chk:has(input:focus-visible){outline:2px solid var(--blue8);outline-offset:1px}
#crumb{flex:1;min-width:120px;color:var(--sub);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#crumb a{color:var(--accent);cursor:pointer}
#crumb a:hover{text-decoration:underline}
#crumb b{color:var(--ink)}
#stageScroll{flex:1;overflow:auto;min-height:0;padding:8px 3px;display:flex;background:#ffffff}   /* 좌우 여백 3px — 화면을 최대한 크게 */
/* 1920×1080 비율 고정 — 가로·세로 모두에 맞춰 줄이므로 화면 전체가 항상 보인다 */
/* flex:none = 공간이 모자라도 줄어들지 않는다(줄면 오른쪽 F7~F12 가 잘림).
   margin:auto = 작으면 가운데, 크면(확대) 왼쪽부터 스크롤 */
#stageCol{display:flex;flex-direction:column;flex:none;margin:auto;min-width:0}
#viewport{position:relative;overflow:hidden;flex:none}
/* 기능영역 이동 줄 — 화면 바로 위. 화면과 같은 폭을 8칸으로 균등 분할한다.
   버튼 모양(테두리·면)을 두지 않고 글자와 밑줄만으로 현재 위치를 보인다. */
#areaBar{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));
  border-bottom:1px solid var(--line);margin-bottom:9px;flex:none}
/* 줄이 없는 화면에서도 자리는 그대로 — 두 종류 화면의 크기를 같게 한다 */
body:not(.areanav) #areaBar{visibility:hidden;pointer-events:none}
.abtn{display:block;width:100%;min-width:0;padding:4px 6px 7px;margin-bottom:-1px;
  border:0;border-bottom:2px solid transparent;background:none;cursor:pointer;
  font:600 12.5px/1.3 inherit;color:var(--gray10);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:color .12s,border-color .12s}
.abtn:hover{color:var(--gray12)}
.abtn .ac{font:700 10px/1 var(--mono);letter-spacing:.07em;color:var(--gray9);margin-right:5px}
.abtn:hover .ac{color:var(--gray11)}
.abtn.on{color:var(--blue11);border-bottom-color:var(--blue9)}
.abtn.on .ac{color:var(--blue10)}
.abtn.off{opacity:.36}
#stageScale{transform-origin:0 0;position:relative}
.screen{position:relative;transform-origin:0 0;background:var(--void);color:var(--fg);
  font-family:var(--gva);letter-spacing:-.01em;
  box-shadow:0 10px 36px rgba(28,32,36,.16),0 0 0 1px rgba(28,32,36,.10);
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
/* 외곽 베젤 심선 — CoreUiBuilder.outerBezel */
.bezel{position:absolute;inset:0;border:1px solid var(--seam);pointer-events:none;z-index:9}

/* StatusBar — StatusBarView.xaml */
.sbar{position:absolute;left:0;top:0;display:flex;flex-direction:column;overflow:hidden;
  border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline)}
.sbrow{display:flex;min-width:0}
.sbrow.r0{border-bottom:1px solid rgba(255,255,255,.06)}
.zone{background:linear-gradient(180deg,var(--zone-hi),var(--zone-lo));
  border-top:1px solid var(--zone-edge);display:flex;align-items:center;padding:0 14px;min-width:0}
.zone.grow{flex:1;min-width:0}
.sdiv{width:1px;height:20px;background:var(--divider);margin:0 18px;flex:none}
.slab{font-size:16px;color:var(--status-label);white-space:nowrap}
.sval{font-size:22px;color:var(--status-value);font-variant-numeric:tabular-nums;white-space:nowrap}
.sval.warn{color:var(--warn)} .sval.caut{color:var(--caut)} .sval.ok{color:var(--ok)}
.zone .pair{display:flex;align-items:center;gap:10px;min-width:0}
.zone.pos{min-width:330px;justify-content:space-between;gap:10px}
.custom{display:flex;flex:1;min-width:0}
.citem{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:0 18px;min-width:0;border-left:1px solid var(--divider)}
.citem .sval{font-size:20px;overflow:hidden;text-overflow:ellipsis}
.alert{display:flex;align-items:center;gap:0;flex:1;min-width:0;
  border-left:3px solid var(--fg-off);padding:0 18px 0 14px}
.alert.warn{border-left-color:var(--warn)} .alert.caut{border-left-color:var(--caut)}
.alert .slab{margin-right:12px}
.alert .atime{margin-right:14px}
.alert .amsg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:12px}
.alert.warn .atime,.alert.warn .amsg{color:var(--warn)}
.alert.caut .atime,.alert.caut .amsg{color:var(--caut)}
.badge2{min-width:26px;height:22px;padding:0 7px;border-radius:1px;background:var(--fg-off);
  color:#0A0A0C;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.alert.warn .badge2{background:var(--warn)} .alert.caut .badge2{background:var(--caut)}
.tally{display:flex;align-items:center;justify-content:space-between;width:96px}
.tally .sval{font-size:19px}

/* 기능영역 라벨 8개 — TopLabelStyle (6px 트랙바, 좌/우 반쪽) */
.flabels{position:absolute}
.lbl{position:absolute;display:flex;align-items:center;background:transparent}
.lbl .half{height:6px;flex:1}
.lbl .half.l{border-radius:2px 0 0 2px}
.lbl .half.r{border-radius:0 2px 2px 0}
.lbl .half{background:linear-gradient(180deg,#CEDCE8 0%,#8C9AA8 20%,#4E5C6A 100%)}
.lbl.selected .half,
.lbl.selectedLeft .half.l,
.lbl.selectedRight .half.r{background:linear-gradient(180deg,#CFF6FF 0%,#22D4FF 35%,#00A8E4 100%)}
.lbl.disable .half{background:var(--label-dis)}
.lbl.disable::after{content:"";position:absolute;left:0;right:0;height:6px;border-radius:2px;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 1px,transparent 1px 8px)}
.lbl.hi{outline:2px solid rgba(255,255,255,.85);outline-offset:3px;border-radius:3px;z-index:8;
  box-shadow:0 0 0 5px rgba(94,177,239,.2)}

/* 소프트키 — SideSoftButtonStyle / SideSoftButtonRightStyle / BottomSoftButtonStyle */
.key{position:absolute;border-radius:6px;overflow:hidden;color:var(--fg);
  background:linear-gradient(180deg,var(--surface-hi),var(--surface-lo));
  border-top:1px solid var(--hairline);border-bottom:1px solid var(--engrave)}
.key .id{position:absolute;top:7px;right:8px;font-family:var(--mono);font-size:18px;
  color:var(--fg-dim);line-height:1}
/* 라벨 21px 두 줄(줄높이 25) — 옆 키 153×100 : 위 34 + 50 = 84 < 100 으로 들어간다.
   디자인 1·2·3 이 모두 이 크기를 쓴다 — 고칠 때는 여기와 .v2 / .v3 한 쌍을 같이. */
.key .lb{position:absolute;font-size:21px;font-weight:600;line-height:25px;max-height:50px;
  overflow:hidden;word-break:keep-all;overflow-wrap:break-word}
.key.side .lb{left:8px;right:8px;top:34px}
.key.side.right .lb{text-align:right}
.key.bot .lb{left:14px;right:14px;top:50%;transform:translateY(-50%);text-align:center;max-height:25px}
.key .edge{position:absolute;background:var(--hmi);border-radius:2px;display:none}
.key.side .edge{width:3px;left:2px;top:6px;bottom:6px}
.key.side.right .edge{left:auto;right:2px}
.key.bot .edge{height:3px;left:6px;right:6px;top:2px}
.key.selected{background:linear-gradient(180deg,var(--sel-hi),var(--sel-lo));color:var(--hmi-fg)}
.key.selected .id{color:var(--hmi)}
.key.selected .edge{display:block}
.key.disable{background:var(--surface-off);color:var(--fg-off);border-top-color:transparent;
  border-bottom-color:transparent}
.key.disable .id{color:var(--fg-off)}
.key.disable::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 1px,transparent 1px 8px)}
.key.hidden{visibility:hidden}
.key.hidden.ghosted{visibility:visible;opacity:.18}
.key.nav{cursor:pointer}
.key.hi{outline:2px solid rgba(255,255,255,.85);outline-offset:3px;z-index:8;overflow:visible;
  box-shadow:0 0 0 5px rgba(94,177,239,.2)}
body.editing .key.hi{box-shadow:none;outline-color:var(--tool);outline-width:2px}
body.editing .lbl.hi{box-shadow:none;outline-color:var(--tool);outline-width:2px}

/* Application 영역 — 보호 프레임(1px seam, r14, 여백 4) + 순검정 캔버스 */
.appframe{position:absolute;border:1px solid var(--seam);border-radius:14px;pointer-events:none}
.appzone{position:absolute;overflow:hidden;background:var(--void)}
.appgrid{position:absolute;inset:0;display:none;pointer-events:none;
  background-image:linear-gradient(to right,#ffffff10 1px,transparent 1px),
                   linear-gradient(to bottom,#ffffff10 1px,transparent 1px);
  background-size:30px 30px}
body.editing .appgrid{display:block}
.appempty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;color:var(--fg-off);font-family:var(--mono);font-size:18px;text-align:center}

/* ---------- [5] 페이지 요소 ---------- */
.appimg{position:absolute;inset:0;width:100%;height:100%}
.appimg.free{inset:auto;max-width:none;object-fit:fill}
/* 그림 조정 — 조정 중에는 이 층이 맨 위에서 모든 누름을 받는다 */
.imgwrap{position:absolute;z-index:30}               /* Application 영역 밖에 둔다 — 넘친 그림의 손잡이도 잡히게 */
.imgedit{position:absolute;inset:0;cursor:move;background:rgba(0,0,0,.001)}
.imgedit .ighost{position:absolute;max-width:none;opacity:.3;pointer-events:none}   /* 영역 밖·가린 부분을 흐리게 보여 준다 */
.imgedit .iframe{position:absolute;outline:2px solid #3e9bff;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.imgedit.crop .iframe{outline-color:#ffb020;outline-style:dashed}
.ihnd{position:absolute;width:22px;height:22px;background:#fff;border:3px solid #3e9bff;border-radius:3px;margin:-11px 0 0 -11px}
.imgedit.crop .ihnd{border-color:#ffb020;background:#1b1400}
.ihnd[data-ih="nw"]{left:0;top:0;cursor:nwse-resize} .ihnd[data-ih="n"]{left:50%;top:0;cursor:ns-resize}
.ihnd[data-ih="ne"]{left:100%;top:0;cursor:nesw-resize} .ihnd[data-ih="e"]{left:100%;top:50%;cursor:ew-resize}
.ihnd[data-ih="se"]{left:100%;top:100%;cursor:nwse-resize} .ihnd[data-ih="s"]{left:50%;top:100%;cursor:ns-resize}
.ihnd[data-ih="sw"]{left:0;top:100%;cursor:nesw-resize} .ihnd[data-ih="w"]{left:0;top:50%;cursor:ew-resize}
.itag{position:absolute;left:0;top:14px;margin-left:14px;white-space:nowrap;font:600 20px/1 ui-monospace,Consolas,monospace;color:#fff;
  background:rgba(14,40,70,.92);border:1px solid #3e9bff;padding:8px 10px;border-radius:4px;pointer-events:none}
/* Core 설명 화면 : 요소를 1920×1080 전체에 얹는다 */
.corelayer{position:absolute;inset:0}
/* 설명 페이지 — HMI 틀 없는 자유 양식 슬라이드 */
.screen.slide.light{background:#fff;color:#141c22}
.screen.slide.dark{background:#0e1215}
.slide .corelayer{overflow:hidden}
.slide.light .appgrid{background-image:linear-gradient(to right,rgba(0,0,0,.06) 1px,transparent 1px),
  linear-gradient(to bottom,rgba(0,0,0,.06) 1px,transparent 1px)}
.slide .appempty{color:#9aa5ab;font-family:inherit;font-size:30px}
body:not(.editing) .slide .appempty{display:none}
.slide .w-text{justify-content:flex-start;line-height:1.55}
.slide.light .w-panel,.slide.light .w-list,.slide.light .w-tbl{background:#f7f9fa;border-color:rgba(0,0,0,.1)}
.slide.light .w-panel>h3{background:#e9eef1;color:#141c22;border-bottom-color:rgba(0,0,0,.08)}
.slide.light .w-row,.slide.light .w-list .li,.slide.light .w-tbl th,.slide.light .w-tbl td{border-color:rgba(0,0,0,.08)}
.slide.light .w-tbl th{background:rgba(0,0,0,.03)}
.slide.light .w-metric .n{color:#141c22}
.slide.light .w-box{background:#eef2f4;color:#56636a;border-color:rgba(0,0,0,.08)}
body.nums .slide.light .el.zone2>.body{border-color:rgba(0,0,0,.35);background:rgba(0,0,0,.02)}
.slide.light .el .no{background:rgba(240,240,243,.55);color:var(--gray12);border-color:var(--gray8);box-shadow:none}
.slide.light .el.hov .no,.slide.light .el.sel .no{background:var(--gray3)}
body:not(.editing) .slide.light .el.hov,body:not(.editing) .slide.light .el.sel{outline-color:var(--blue9)}
.el{position:absolute}
.el>.body{position:absolute;inset:0;overflow:hidden}
.el.zone2>.body{border:1px dashed transparent;border-radius:4px}
body.nums .el.zone2>.body{border:2px dashed rgba(255,255,255,.55);background:rgba(255,255,255,.035)}
.el .no{position:absolute;left:8px;top:8px;min-width:30px;height:30px;padding:0 8px;z-index:3;
  background:rgba(255,255,255,.12);color:#fff;font:700 17px/27px var(--mono);border-radius:15px;text-align:center;
  border:1.5px solid rgba(255,255,255,.92);display:none;transition:background-color .12s;
  text-shadow:0 0 3px rgba(0,0,0,.95),0 1px 2px rgba(0,0,0,.85);        /* 밝은 화면 위에서도 숫자가 읽힌다 */
  box-shadow:0 0 0 1px rgba(0,0,0,.55),0 1px 4px rgba(0,0,0,.4)}
/* 번호는 반투명 — 뒤의 화면이 비친다. 그 요소를 가리키거나 고르면 진하게 */
.el.hov .no,.el.sel .no{background:rgba(255,255,255,.95);color:#0b1014;text-shadow:none}
body.nums .el .no{display:block}
.el.hov{outline:2px solid rgba(255,255,255,.75);outline-offset:1px;z-index:4}
/* 보기 모드 강조 — 주변을 어둡게 하지 않고 그 요소만 윤곽 + 옅은 빛 */
body:not(.editing) .el.hov{outline:2px solid rgba(255,255,255,.85);outline-offset:2px;border-radius:4px;
  box-shadow:0 0 0 6px rgba(94,177,239,.18);z-index:7}
body:not(.editing) .el.sel{outline:2px solid var(--blue8);outline-offset:2px;border-radius:4px;
  box-shadow:0 0 0 6px rgba(94,177,239,.28);z-index:7}
body.editing .el.sel{outline:2px solid var(--tool);outline-offset:1px;z-index:6}
body.editing .el{cursor:move}
.hnd{position:absolute;width:15px;height:15px;background:#fff;border:2px solid var(--tool);
  border-radius:2px;z-index:8;display:none}
body.editing .el.sel>.hnd{display:block}
.hnd[data-h=nw]{left:-8px;top:-8px;cursor:nwse-resize} .hnd[data-h=ne]{right:-8px;top:-8px;cursor:nesw-resize}
.hnd[data-h=sw]{left:-8px;bottom:-8px;cursor:nesw-resize} .hnd[data-h=se]{right:-8px;bottom:-8px;cursor:nwse-resize}
.hnd[data-h=n]{left:calc(50% - 7px);top:-8px;cursor:ns-resize} .hnd[data-h=s]{left:calc(50% - 7px);bottom:-8px;cursor:ns-resize}
.hnd[data-h=w]{left:-8px;top:calc(50% - 7px);cursor:ew-resize} .hnd[data-h=e]{right:-8px;top:calc(50% - 7px);cursor:ew-resize}
.marquee{position:absolute;border:2px solid var(--tool);background:rgba(76,141,255,.14);z-index:9;pointer-events:none}
.mqinfo{position:absolute;left:-2px;top:-40px;background:var(--tool);color:#fff;font-family:var(--mono);
  font-size:22px;font-weight:700;padding:3px 10px;border-radius:4px;white-space:nowrap}
.gdx,.gdy{position:absolute;background:var(--tool);z-index:20;pointer-events:none;
  box-shadow:0 0 6px rgba(76,141,255,.75)}
.gdx{top:0;bottom:0;width:2px;margin-left:-1px}
.gdy{left:0;right:0;height:2px;margin-top:-1px}
.readout{position:absolute;z-index:21;background:var(--tool);color:#fff;font-family:var(--mono);
  font-size:22px;font-weight:700;padding:4px 11px;border-radius:4px;white-space:nowrap;pointer-events:none}

/* 요소 위젯 — Application 쪽 톤(카드 r12) */
.w-box{width:100%;height:100%;border:1px solid var(--hairline);border-radius:6px;
  background:rgba(35,35,38,.55);display:flex;align-items:center;justify-content:center;
  text-align:center;color:var(--fg-dim);font-size:24px;padding:10px}
.w-panel{width:100%;height:100%;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;
  border:1px solid var(--hairline);background:#0F1013}
.w-panel>h3{background:linear-gradient(180deg,#232326,#1A1A1D);color:var(--fg);
  font-size:24px;font-weight:600;padding:14px 22px;display:flex;justify-content:space-between;
  align-items:center;border-bottom:1px solid rgba(0,0,0,.5);flex:none}
.w-panel>h3 em{font-family:var(--mono);font-style:normal;font-size:18px;color:var(--fg-dim);letter-spacing:.09em}
.w-panel>.pb{flex:1;padding:18px 22px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden}
.w-row{display:flex;justify-content:space-between;align-items:baseline;font-size:24px;
  padding-top:12px;border-top:1px solid rgba(255,255,255,.055)}
.w-row:first-child{border-top:0;padding-top:0}
.w-row .k{color:var(--fg-dim)}
.w-row .v{font-variant-numeric:tabular-nums}
.v.warn{color:var(--warn)} .v.caut{color:var(--caut)} .v.ok{color:var(--ok)} .v.acc{color:var(--hmi)}
.w-metric{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;gap:4px}
.w-metric .hd{display:flex;align-items:baseline;gap:10px}
.w-metric .n{font-size:88px;font-weight:300;letter-spacing:-.04em;line-height:1;color:#fff;
  font-variant-numeric:tabular-nums}
.w-metric .u{font-size:26px;color:var(--fg-dim)}
.w-metric .cap{font-size:22px;color:var(--fg-dim)}
.w-text{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;
  white-space:pre-wrap;word-break:keep-all}
.w-btn{width:100%;height:100%;border-radius:6px;background:linear-gradient(180deg,var(--surface-hi),var(--surface-lo));
  border-top:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:600;text-align:center;padding:6px 14px}
.w-btn.selected{background:linear-gradient(180deg,var(--sel-hi),var(--sel-lo));color:var(--hmi-fg)}
.w-btn.disable{background:var(--surface-off);color:var(--fg-off)}
.w-list{width:100%;height:100%;overflow:hidden;border:1px solid var(--hairline);border-radius:8px;background:#0F1013}
.w-list .li{display:flex;gap:16px;align-items:center;padding:13px 20px;font-size:24px;
  border-bottom:1px solid rgba(255,255,255,.05)}
.w-list .li .mk{width:9px;height:9px;border-radius:50%;background:var(--fg-dim);flex:none}
.w-list .li .mk.warn{background:var(--warn)} .w-list .li .mk.caut{background:var(--caut)} .w-list .li .mk.ok{background:var(--ok)}
.w-tbl{width:100%;height:100%;border-collapse:collapse;font-size:22px;background:#0F1013}
.w-tbl th,.w-tbl td{border-bottom:1px solid rgba(255,255,255,.06);padding:12px 18px;text-align:left}
.w-tbl th{color:var(--fg-dim);font-size:17px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
  background:rgba(255,255,255,.03)}
.w-tbl td{font-variant-numeric:tabular-nums}
.w-img{width:100%;height:100%;object-fit:contain;display:block}

/* ---------- [5-2] 디자인 버전 2 — 전술 콘솔 (고대비) ----------
   규칙 (이 블록 안에서 예외를 만들지 않는다)
   · 바탕     : 순검정. 면은 --v2-surf 한 가지
   · 선       : 구조선 1px(--v2-line / --v2-line2), 누를 수 있는 칸만 2px — 검은 바탕에서 흐려 보이지 않게 밝게 잡는다
   · 글자색   : 값·제목 = --v2-txt(흰색), 라벨·F번호·머리글 = --v2-dim(한 가지)
   · 강조색   : 선택(색 반전) · 제목 표시 막대에만 --v2-acc  (모서리 장식은 쓰지 않는다)
   · 굵기     : 라벨·값(고정폭) 400 / 제목·키 라벨 600  (그 이상 쓰지 않는다) — 값은 굵기 대신 흰색·크기로 구분
   · 글꼴     : 한글·제목·키 = Pretendard, 숫자·코드·상태값 = D2Coding(한글 포함 고정폭)
   · 대문자   : 라벨·머리글은 고정폭 대문자, 자간 --v2-track 하나로 (상태바만 한글이 섞여 .05em)
   · 비활성   : 실선 유지 + 테두리·글자를 낮추고 옅은 빗금 (WPF 규격의 Disabled 해치)
   · 경고·주의·정상 색은 의미 그대로
   <div class="screen v2"> 일 때만 적용 (문서 meta.design = 'v2') */
.screen.v2{--v2-surf:#05090b;--v2-line:#6b8492;--v2-line2:#34454e;--v2-dim:#a6b9c3;
  --v2-txt:#eef5f8;--v2-acc:#19d3ff;--v2-inv:#00141c;--v2-off-line:#2d3a41;--v2-off-txt:#56666e;
  --v2-w1:400;--v2-w2:600;--v2-track:.1em;
  --v2-mono:"D2 coding","Cascadia Mono",Consolas,"Malgun Gothic",monospace;
  font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;background:#000}

/* 공통 : 라벨 / 값 */
.v2 .slab,.v2 .w-tbl th,.v2 .w-metric .u,.v2 .w-metric .cap,.v2 .w-panel>h3 em,.v2 .key .id{
  font-family:var(--v2-mono);font-weight:var(--v2-w1);letter-spacing:var(--v2-track);
  text-transform:uppercase;color:var(--v2-dim)}
.v2 .sval,.v2 .w-row .v,.v2 .w-tbl td{font-family:var(--v2-mono);font-weight:var(--v2-w1);color:var(--v2-txt)}
.v2 .sval.warn,.v2 .w-row .v.warn{color:var(--warn)}
.v2 .sval.caut,.v2 .w-row .v.caut{color:var(--caut)}
.v2 .sval.ok,.v2 .w-row .v.ok{color:var(--ok)}
.v2 .w-row .v.acc{color:var(--v2-acc)}

/* 상태바 */
.v2 .sbar{border-top:0;border-bottom:1px solid var(--v2-line)}
.v2 .sbrow.r0{border-bottom:1px solid var(--v2-line)}
.v2 .zone{background:#000;border-top:0}
.v2 .sdiv{background:var(--v2-line);height:22px}
.v2 .slab{font-size:17px;letter-spacing:.05em;color:#aec1cb}
.v2 .sval{font-size:24px;letter-spacing:.01em}
.v2 .citem .sval{font-size:23px}
.v2 .zone{padding:0 16px}
.v2 .tally .sval{font-size:22px}
.v2 .citem{border-left:1px solid var(--v2-line)}
.v2 .alert{border-left-width:5px}
.v2 .alert .amsg{font-family:inherit;font-weight:var(--v2-w1)}
.v2 .alert .atime{font-weight:var(--v2-w1)}
.v2 .badge2{border-radius:0;font-family:var(--v2-mono);font-weight:var(--v2-w2)}

/* 기능영역 라벨 */
.v2 .lbl .half{background:#7d929d;border-radius:0}
.v2 .lbl.selected .half,.v2 .lbl.selectedLeft .half.l,.v2 .lbl.selectedRight .half.r{background:var(--v2-acc)}
.v2 .lbl.disable .half{background:#2d3a41}
.v2 .lbl.disable::after{border-radius:0}

/* 소프트키 */
.v2 .key{background:#000;border:2px solid var(--v2-line);border-radius:0;box-shadow:none;color:var(--v2-txt)}
.v2 .key .id{font-size:16px}
/* 라벨 24px 두 줄(줄높이 28) — 옆 키 153×100 : 위 32 + 56 = 88 < 100 로 들어간다 */
.v2 .key .lb{font-size:21px;font-weight:var(--v2-w2);line-height:25px;max-height:50px;letter-spacing:-.01em}
.v2 .key.side .lb{top:34px}
.v2 .key.bot .lb{max-height:25px;left:12px;right:12px}      /* 하단 키는 높이 48 — 한 줄 */
.v2 .key .edge{display:none!important}
.v2 .key.selected{background:var(--v2-acc);border-color:var(--v2-acc);color:var(--v2-inv)}
.v2 .key.selected .id{color:var(--v2-inv)}
.v2 .key.disable{background:#000;border-color:var(--v2-off-line);color:var(--v2-off-txt)}
.v2 .key.disable .id{color:var(--v2-off-line)}

/* Application 영역 — 1px 테두리 + 전술 격자 */
.v2 .appframe{border:1px solid var(--v2-line);border-radius:0;background:none}
.v2 .appzone{background:
    linear-gradient(to right,rgba(25,211,255,.08) 1px,transparent 1px) 0 0 / 60px 60px,
    linear-gradient(to bottom,rgba(25,211,255,.08) 1px,transparent 1px) 0 0 / 60px 60px,#000}
.v2 .bezel{border-color:var(--v2-line)}

/* 패널 · 목록 · 표 */
.v2 .w-panel,.v2 .w-list,.v2 .w-tbl{border-radius:0;border:1px solid var(--v2-line)}
.v2 .w-panel{background:var(--v2-surf)}
.v2 .w-list,.v2 .w-tbl{background:var(--v2-surf)}
.v2 .w-panel>h3{background:transparent;border-bottom:1px solid var(--v2-line);font-family:inherit;
  font-size:22px;font-weight:var(--v2-w2);letter-spacing:.02em;
  color:var(--v2-txt);box-shadow:inset 4px 0 0 var(--v2-acc);padding-left:24px}
.v2 .w-panel>h3 em{font-size:16px}
.v2 .w-row{border-top:1px solid var(--v2-line2)}
.v2 .w-row .k{color:var(--v2-dim);font-weight:var(--v2-w1)}
.v2 .w-list .li{border-bottom:1px solid var(--v2-line2);font-weight:var(--v2-w1);color:var(--v2-txt)}
.v2 .w-list .li .mk{border-radius:0;width:10px;height:10px}
.v2 .w-tbl th{background:transparent;font-size:16px;border-bottom:1px solid var(--v2-line)}
.v2 .w-tbl td{border-bottom-color:var(--v2-line2)}

/* 수치 · 텍스트 · 박스 · 버튼 */
.v2 .w-metric .n{font-family:var(--v2-mono);font-weight:var(--v2-w1);letter-spacing:-.02em;color:var(--v2-txt)}
.v2 .w-metric .n.caut{color:var(--caut)} .v2 .w-metric .n.warn{color:var(--warn)} .v2 .w-metric .n.ok{color:var(--ok)}
.v2 .w-box{border-radius:0;border:1px solid var(--v2-line);background:var(--v2-surf);
  font-family:var(--v2-mono);font-weight:var(--v2-w1);letter-spacing:var(--v2-track);color:var(--v2-dim)}
.v2 .w-btn{border-radius:0;background:#000;border:2px solid var(--v2-line);box-shadow:none;
  font-size:30px;font-weight:var(--v2-w2);color:var(--v2-txt)}
.v2 .w-btn.selected{background:var(--v2-acc);border-color:var(--v2-acc);color:var(--v2-inv)}
.v2 .w-btn.disable{position:relative;background:#000;border-color:var(--v2-off-line);color:var(--v2-off-txt)}
.v2 .w-btn.disable::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 1px,transparent 1px 8px)}
.v2 .w-ph{border-radius:0;border:1px solid var(--v2-line);font-family:var(--v2-mono)}
.v2 .el.zone2>.body{border-radius:0}
/* ---------- [5-3] 디자인 버전 3 — 그린 콘솔 (고대비 · 순검정 + 녹색 버튼) ----------
   녹색은 버튼 면에만 쓴다. 글자 · 상태바 · 패널은 중성(흰색 · 회색)으로 둔다.
   규칙
   · 바탕     : 순검정. 상태바·패널 면은 --v3-surf / --v3-panel — 둘 다 중성 회색
   · 버튼     : 녹색 면(--v3-key) + 흰 글자, 고정폭 굵은 글꼴. 누를 수 있는 것은 전부 이 모양
   · 선택     : 노란 형광 면(--v3-sel) + 진한 글자 — 멀리서도 어디가 선택인지 보인다
   · 비활성   : 회색 면(--v3-key-off) + 흐린 글자 (빗금 없음)
   · 상태바   : 값은 흰 글자 고정폭. 경고·주의·정상만 상태색을 입힌다
   · 상태색   : 녹색(--v3-grn)이 남는 곳은 '정상' 표시 하나뿐이다
   · 글꼴     : 전부 D2Coding(한글 포함 고정폭). 굵기 400 / 700 두 가지
   <div class="screen v3"> 일 때만 적용 (문서 meta.design = 'v3') */
.screen.v3{--v3-key:#0b8a0b;--v3-key-edge:#066206;
  --v3-sel:#c8f32a;--v3-sel-edge:#a3cc1c;--v3-sel-txt:#0c1a00;
  --v3-key-off:#2a2d30;--v3-key-off-edge:#3a3e42;--v3-off-txt:#7f868b;
  --v3-txt:#ffffff;--v3-grn:#3fe03f;--v3-dim:#9aa3a8;--v3-surf:#1c1d1e;
  --v3-line:#5a5d60;--v3-line2:#2e3133;--v3-panel:#101214;--v3-pline:#3a3f42;
  --v3-mono:"D2 coding","Cascadia Mono",Consolas,"Malgun Gothic",monospace;
  font-family:var(--v3-mono);background:#000;letter-spacing:0}

/* 상태바 */
.v3 .sbar{border:1px solid var(--v3-line);border-top:0}
.v3 .sbrow.r0{border-bottom:1px solid var(--v3-line)}
.v3 .zone{background:var(--v3-surf);border-top:0;padding:0 16px}
.v3 .sdiv{background:var(--v3-line2);height:22px}
.v3 .slab{font-family:var(--v3-mono);font-size:17px;color:var(--v3-dim);letter-spacing:.02em}
.v3 .sval{font-family:var(--v3-mono);font-size:24px;font-weight:400;color:var(--v3-txt)}
.v3 .sval.warn{color:var(--warn)} .v3 .sval.caut{color:var(--caut)} .v3 .sval.ok{color:var(--v3-grn)}
.v3 .citem{border-left:1px solid var(--v3-line2)}
.v3 .citem .sval{font-size:23px}
.v3 .tally .sval{font-size:22px}
.v3 .alert{border-left-width:6px;background:#232426}
.v3 .alert .amsg,.v3 .alert .atime{font-family:var(--v3-mono);font-size:24px;font-weight:400}
.v3 .badge2{border-radius:0;font-family:var(--v3-mono);font-weight:700}

/* 기능영역 라벨 — 트랙 바 대신 녹색 막대, 선택은 노란 테두리 */
.v3 .lbl .half{height:100%;background:var(--v3-key);border-radius:0}
.v3 .lbl .half.l{border-radius:5px 0 0 5px}
.v3 .lbl .half.r{border-radius:0 5px 5px 0}
.v3 .lbl.selected .half,.v3 .lbl.selectedLeft .half.l,.v3 .lbl.selectedRight .half.r{background:var(--v3-sel)}
.v3 .lbl.disable .half{background:var(--v3-key-off)}
.v3 .lbl.disable::after{display:none}

/* 소프트키 */
.v3 .key{background:var(--v3-key);border:2px solid var(--v3-key-edge);border-radius:6px;box-shadow:none;color:var(--v3-txt)}
.v3 .key .id{font-family:var(--v3-mono);font-size:14px;color:rgba(255,255,255,.55);top:6px;right:8px}
.v3 .key .lb{font-family:var(--v3-mono);font-size:21px;font-weight:700;line-height:25px;max-height:50px;letter-spacing:0;text-align:center}
.v3 .key.side .lb,.v3 .key.side.right .lb{left:8px;right:8px;top:50%;transform:translateY(-50%);text-align:center}
.v3 .key .edge{display:none!important}
.v3 .key.selected{background:var(--v3-sel);border:2px solid var(--v3-sel-edge);color:var(--v3-sel-txt)}
.v3 .key.selected .id{color:rgba(12,26,0,.55)}
.v3 .key.disable{background:var(--v3-key-off);border-color:var(--v3-key-off-edge);color:var(--v3-off-txt)}
.v3 .key.disable .id{color:var(--v3-off-txt)}
.v3 .key.disable::after{display:none}

/* Application 영역 — 회색 1px 테두리, 모서리 각지게 */
.v3 .appframe{border:1px solid var(--v3-line);border-radius:0}
.v3 .appzone{background:#000}
.v3 .bezel{border-color:#111}

/* 패널 · 목록 · 표 — 짙은 녹색 면 + 녹색 테두리 */
.v3 .w-panel,.v3 .w-list,.v3 .w-tbl{border:3px solid var(--v3-pline);border-radius:10px;background:var(--v3-panel)}
.v3 .w-tbl{border-radius:0}
.v3 .w-panel>h3{background:transparent;border-bottom:0;font-family:var(--v3-mono);font-size:24px;font-weight:700;
  color:var(--v3-txt);justify-content:center}
.v3 .w-panel>h3{position:relative}
.v3 .w-panel>h3 em{position:absolute;right:22px;top:50%;transform:translateY(-50%);
  font-family:var(--v3-mono);font-size:17px;color:var(--v3-dim)}
.v3 .w-row{border-top:1px solid rgba(255,255,255,.10);font-family:var(--v3-mono)}
.v3 .w-row .k{color:var(--v3-dim)}
.v3 .w-row .v{color:var(--v3-txt)}
.v3 .w-row .v.ok{color:var(--v3-grn)} .v3 .w-row .v.acc{color:#35d6ff}
.v3 .w-list .li{border-bottom:1px solid rgba(255,255,255,.10);font-family:var(--v3-mono);color:var(--v3-txt)}
.v3 .w-list .li .mk{width:22px;height:22px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.v3 .w-list .li .mk.ok{background:var(--v3-grn)}
.v3 .w-tbl th{background:transparent;font-family:var(--v3-mono);color:var(--v3-dim);border-bottom:1px solid var(--v3-pline)}
.v3 .w-tbl td{font-family:var(--v3-mono);color:var(--v3-txt);border-bottom-color:rgba(255,255,255,.10)}

/* 수치 · 텍스트 · 박스 · 버튼 */
.v3 .w-metric .n{font-family:var(--v3-mono);font-weight:400;letter-spacing:-.02em;color:var(--v3-txt)}
.v3 .w-metric .n.caut{color:var(--caut)} .v3 .w-metric .n.warn{color:var(--warn)}
.v3 .w-metric .u,.v3 .w-metric .cap{font-family:var(--v3-mono);color:var(--v3-dim)}
.v3 .w-text{font-family:var(--v3-mono)}
.v3 .w-box{border:2px solid var(--v3-pline);border-radius:8px;background:var(--v3-panel);font-family:var(--v3-mono);color:var(--v3-dim)}
.v3 .w-btn{border-radius:6px;background:var(--v3-key);border:2px solid var(--v3-key-edge);box-shadow:none;
  font-family:var(--v3-mono);font-weight:700;color:var(--v3-txt)}
.v3 .w-btn.selected{background:var(--v3-sel);border:2px solid var(--v3-sel-edge);color:var(--v3-sel-txt)}
.v3 .w-btn.disable{background:var(--v3-key-off);border-color:var(--v3-key-off-edge);color:var(--v3-off-txt)}
.v3 .w-ph{border-radius:0;border:1px solid var(--v3-line);font-family:var(--v3-mono)}
.v3 .el.zone2>.body{border-radius:0}
.w-ph{width:100%;height:100%;border:1px dashed var(--fg-off);border-radius:6px;display:flex;
  align-items:center;justify-content:center;color:var(--fg-off);font-size:22px}

/* ---------- [7] 속성 패널 ---------- */
#inspPane{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative}
#tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
#tabs button{flex:1;border:0;background:none;padding:10px 4px;cursor:pointer;font-size:13.5px;font-weight:600;
  border-bottom:2px solid transparent;color:var(--sub)}
#tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
#inspBody{overflow:auto;padding:12px 13px 40px;flex:1}

/* 보기(발표) 모드 설명판 */
#inspBody.viewmode{padding:17px 18px 48px;font-size:15px}
.vhead{border-bottom:1px solid var(--line);padding-bottom:11px;margin-bottom:14px}
.vhead h2{font-size:22px;letter-spacing:-.02em;line-height:1.25}
.vmeta{color:var(--sub);font-size:13px;margin-top:3px}
.vmeta code{color:var(--accent);font-weight:700}
.vdesc{margin-top:9px;line-height:1.6;word-break:keep-all}
.vsec{margin-bottom:16px}
.vsec h3{display:flex;align-items:center;gap:10px;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:#2c3a42;
  font-weight:700;margin-bottom:7px}
.vlist{list-style:none;display:flex;flex-direction:column;gap:2px}
.vitem{display:grid;grid-template-columns:24px minmax(0,1fr);gap:9px;padding:6px 6px 6px 3px;
  border-radius:5px;cursor:default;align-items:start}
.vitem:hover{background:var(--gray2)}
.vitem.on{background:var(--blue3);box-shadow:inset 3px 0 0 var(--blue9)}
.vitem .vn{width:24px;height:24px;border-radius:12px;background:var(--gray3);color:var(--gray12);
  box-shadow:inset 0 0 0 1px var(--gray6);
  font-size:12px;font-weight:700;display:grid;place-items:center;font-family:var(--mono)}
.vitem .vn.alt{background:var(--sub);color:#fff}
.vitem b{font-weight:700}
.vitem p{color:#3f4d54;font-size:14px;line-height:1.55;margin-top:1px;word-break:keep-all}
.vnotes{white-space:pre-wrap;line-height:1.75;word-break:keep-all;color:#1f2c34}
.vtbl{width:100%;border-collapse:collapse;font-size:12.5px}
.vtbl td{border-bottom:1px solid var(--line2);padding:4px 6px;vertical-align:top;color:var(--sub)}
.vtbl td:last-child{color:var(--ink)}
.vtip{border:1px solid var(--line2);background:var(--panel2);border-radius:7px;padding:9px 11px;
  font-size:12.5px;color:var(--sub);line-height:1.6}
.vtip b{color:var(--ink)}
.vsec h3::after{content:"";flex:1;height:1px;background:var(--gray5)}
.vareatag{display:inline-block;background:var(--blue3);color:var(--blue11);box-shadow:inset 0 0 0 1px var(--blue6);border-radius:4px;padding:0 6px;
  font-family:var(--mono);font-size:11px;font-weight:700}
.vitem .vn.mono{background:var(--gray3);color:var(--gray12);font-family:var(--mono);width:26px;font-size:11px}
.vitem .vn.area{background:var(--blue3);color:var(--blue11);box-shadow:inset 0 0 0 1px var(--blue6);font-family:var(--mono);width:30px;font-size:10.5px}
.vitem[data-to]{cursor:pointer}
.vitem[data-to]:hover{background:var(--blue2)}
.vgo{display:inline-block;margin-top:2px;color:var(--accent);font-size:12px;font-weight:600}
.vitem.k-disable,.vitem.k-hidden,.vitem.area.disable{opacity:.55}
.vitem.area.selected .vn.area{background:var(--blue5);box-shadow:inset 0 0 0 1px var(--blue8)}
.vlist.tight .vitem{padding:4px 6px 4px 3px}
.vempty{color:var(--sub);font-size:12.5px}
.vnote{margin-top:7px;font-size:11.5px;color:var(--sub);line-height:1.55}
.rl{display:inline-block;font-size:11px;border-radius:99px;padding:0 6px;border:1px solid var(--line);
  color:var(--sub);vertical-align:1px;font-weight:600}
.rl.nav{background:var(--blue3);border-color:var(--blue6);color:var(--blue11)}
.rl.st{background:var(--panel2)}
/* 설명이 길면 1 / N 으로 나눠 넘긴다 */
#sidePager{display:none;align-items:center;justify-content:center;gap:10px;padding:7px 10px;
  border-top:1px solid var(--line);background:var(--panel2);flex:none}
#sidePageNo{font-size:12px;color:var(--sub);font-family:var(--mono);min-width:46px;text-align:center}
#crumb .cbarea{display:inline-block;background:var(--blue3);color:var(--blue11);box-shadow:inset 0 0 0 1px var(--blue6);border-radius:3px;padding:0 5px;
  font-family:var(--mono);font-size:10.5px;font-weight:700;margin-right:3px}
.arow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:6px;align-items:center;margin-top:7px}
.arow .ak{font-family:var(--mono);font-weight:700}
.adesc{margin-top:3px}
.fs{border:1px solid var(--line2);border-radius:7px;margin-bottom:11px;background:var(--panel)}
.fs>summary{cursor:pointer;padding:9px 11px;font-weight:700;font-size:13px;letter-spacing:.02em;
  color:#2c3a42;text-transform:uppercase;list-style:none;display:flex;align-items:center;gap:6px}
.fs>summary::-webkit-details-marker{display:none}
.fs>summary::before{content:"\25B8";font-size:10px}
.fs[open]>summary::before{content:"\25BE"}
.fs>.in{padding:2px 10px 11px;display:flex;flex-direction:column;gap:8px}
.f{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;align-items:center}
.f>label{color:#3a484f;font-size:13px;font-weight:600}
.f.col{grid-template-columns:1fr;gap:3px}
.f.col>label{font-size:12.5px;font-weight:700}
.f4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.f4 .u{position:relative}
.f4 .u>input{padding-right:34px}
.f4 .u>span{position:absolute;right:6px;top:5px;font-size:10px;color:var(--sub);pointer-events:none}
.hint{color:var(--sub);font-size:12.5px;line-height:1.6}
.hint b{color:var(--ink)}
.rowbtns{display:flex;gap:5px;flex-wrap:wrap}
.elist{display:flex;flex-direction:column;gap:3px;margin-top:2px}
.eitem{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:5px;
  padding:3px 5px;cursor:pointer;background:var(--panel)}
.eitem:hover{background:var(--panel2)}
.eitem.sel{border-color:var(--blue7);background:var(--blue3)}
.eitem.hov{border-color:var(--hot)}
.eitem .n{width:21px;height:21px;border-radius:11px;background:var(--gray3);color:var(--gray12);
  box-shadow:inset 0 0 0 1px var(--gray6);font-size:11px;
  font-weight:700;display:grid;place-items:center;font-family:var(--mono);flex:none}
.eitem .nm{font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eitem .tp{font-size:10.5px;color:var(--sub);flex:none}
.eitem .dg{cursor:grab;color:var(--sub);flex:none;padding:0 2px}
.eitem.drag-over{box-shadow:inset 0 -2px 0 var(--hot)}
.eitem .edel{flex:none;width:22px;height:22px;padding:0;border:1px solid transparent;border-radius:5px;
  background:transparent;color:var(--gray9);font-size:11px;line-height:1;cursor:pointer;display:grid;place-items:center}
.eitem .edel:hover{color:#ce2c31;background:#fff0ef;border-color:#f3b6b3}
.badge{display:inline-block;border-radius:99px;padding:0 6px;font-size:10.5px;background:var(--panel2);
  border:1px solid var(--line);color:var(--sub)}
.badge.nav{background:var(--blue3);border-color:var(--blue6);color:var(--blue11)}
.badge.fix{background:#eef0f1}
.krow{display:grid;grid-template-columns:34px minmax(0,1fr) 84px;gap:6px;align-items:center;padding:4px 0}
.krow+.krow{border-top:1px solid var(--line2)}
.krow .fid{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--sub)}
.krow.on .fid{color:var(--accent)}
.imgctl{align-items:center}
.imgpre .btn{flex:1 1 auto;justify-content:center}
.imgnum{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin:6px 0 2px}
.imgnum .f{margin:0}
.imgnum .cap{grid-column:1/-1;font-size:11.5px;color:var(--gray11);font-weight:600}
.thumb{width:100%;border:1px solid var(--line);border-radius:6px;display:block;background:#111}
.mini{font-size:12px;color:var(--sub)}
.warnbox{border:1px solid #e9cf8a;background:#fff8e6;border-radius:6px;padding:7px 9px;font-size:12px}
.histrow{display:grid;grid-template-columns:88px 74px minmax(0,1fr) 24px;gap:5px;align-items:center}
.histrow+.histrow{margin-top:4px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 60px 52px 24px;gap:5px;align-items:center}

/* ---------- [9] 인쇄 / PDF — A4 가로, 화면 하나 = 한 장 ----------
   장 크기는 JS 의 SHEET(1122×793)와 같다. 고정 요소는 왼쪽 위 문서 제목과 오른쪽 아래 쪽 번호뿐 */
#printRoot{display:none}
@media print{
  @page{size:A4 landscape;margin:0}
  html,body{height:auto;overflow:visible;background:#fff;margin:0}
  #shell{display:none!important}
  #printRoot{display:block}
}
#printRoot{--pr-ink:#15191c;--pr-sub:#5d6870;--pr-line:#d9dfe3;--pr-soft:#f3f5f7;--pr-acc:#0d74ce;
  font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;color:var(--pr-ink);
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet{position:relative;width:1122px;height:793px;overflow:hidden;background:#fff;
  padding:28px 32px 0;display:flex;flex-direction:column;break-after:page;page-break-after:always}
.sheet:last-child{break-after:auto;page-break-after:auto}

.sh-h{height:30px;flex:none;display:flex;align-items:center;border-bottom:1px solid var(--pr-line)}
.sh-title{font-size:12px;font-weight:600;color:var(--pr-sub);letter-spacing:-.01em}
.sh-title::before{content:"";display:inline-block;width:3px;height:12px;background:var(--pr-acc);margin-right:8px;vertical-align:-1px}
.sh-body{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:14px}
.sh-f{height:34px;flex:none;display:flex;align-items:center;justify-content:flex-end;position:relative}
.sh-cr{position:absolute;left:0;right:0;text-align:center;color:var(--pr-sub);
  font-size:11px;font-weight:300;letter-spacing:.08em}
.sh-no{font:500 11px/1 "D2 coding",Consolas,monospace;color:var(--pr-sub);letter-spacing:.04em}
.sh-no b{color:var(--pr-ink);font-weight:700}
/* 화면 머리 */
.sc-head{flex:none;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-bottom:12px}
.sc-path{width:100%;font-size:11px;color:var(--pr-sub)}
.sc-path i{font-style:normal;margin:0 6px;color:#aab3b9}
.sc-head h2{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.sc-head h2 small{font-size:12px;color:var(--pr-sub);font-weight:500}
.sc-chip{font:600 10.5px/1 "D2 coding",Consolas,monospace;color:var(--pr-acc);border:1px solid #b7d4ef;
  background:#eef5fc;border-radius:3px;padding:3px 6px}
/* 본문 : 왼쪽 화면 + 설명, 오른쪽 소프트키 */
.sc-grid{flex:1;min-height:0;display:grid;grid-template-columns:790px 1fr;gap:20px}
.sc-left{display:flex;flex-direction:column;min-height:0}
.prshot{position:relative;overflow:hidden;flex:none;border-radius:2px;box-shadow:0 0 0 1px #c9d1d6}
.prshot .screen{box-shadow:none}
/* 인쇄 : 화면을 가리지 않게 속은 거의 투명하게, 대신 흰 테두리·검은 그림자로 또렷하게 */
#printRoot .el .no{background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.95);
  text-shadow:0 0 3px rgba(0,0,0,.95),0 1px 2px rgba(0,0,0,.85);box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.sc-desc,.cont-desc{min-height:0;overflow:hidden;font-size:12.5px;line-height:1.6;word-break:keep-all}
.sc-desc{flex:1;margin-top:12px;column-count:2;column-gap:24px;column-rule:1px solid var(--pr-line)}
.sc-desc .lead{column-span:all}
.sc-desc .dcap{column-span:all}
.sc-desc p,.cont-desc p{margin-bottom:.34em;break-inside:avoid}
.sc-desc .lead,.cont-desc .lead{font-weight:600;font-size:1.06em;margin-bottom:.5em}
.sc-desc .nl,.cont-desc .nl{color:#2c3439}
.sc-desc .empty{color:#9aa4ab}
/* 화면 아래 요소 설명 — 화면 속 번호와 같은 번호 */
.dcap{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--pr-sub);text-transform:uppercase;
  margin:.7em 0 .35em;padding-bottom:4px;border-bottom:1px solid var(--pr-line)}
.er{display:block;position:relative;padding-left:22px;margin-bottom:.4em;break-inside:avoid}
.er .en{position:absolute;left:0;top:2px;width:16px;height:16px;border-radius:50%;background:var(--pr-acc);color:#fff;
  font:700 10px/16px "D2 coding",Consolas,monospace;text-align:center}
.er b{font-weight:700}
.er .eds{color:#39424a}                      /* 편집 전용 .ed 와 겹치지 않게 다른 이름 */
.er .eds::before{content:" — ";color:#9aa4ab}
.sc-right{min-height:0;overflow:hidden;border-left:1px solid var(--pr-line);padding-left:18px;font-size:12px}
.sc-cap{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--pr-sub);text-transform:uppercase;
  padding-bottom:7px;border-bottom:1.5px solid var(--pr-ink);margin-bottom:2px}
.kr{display:flex;gap:10px;padding:.62em 0;border-bottom:1px solid var(--pr-line);break-inside:avoid}
.kr .kid{flex:none;width:34px;height:1.7em;display:grid;place-items:center;border-radius:3px;background:var(--pr-ink);color:#fff;
  font:700 .88em/1 "D2 coding",Consolas,monospace}
.kr .kid.n{width:1.8em;border-radius:50%;background:var(--pr-acc)}
.kr.off .kid{background:#b3bcc2}
.kr .kb{flex:1;min-width:0}
.kr .kl{font-weight:700;line-height:1.35;display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px}
.kr .kl em{font-style:normal;font-weight:600;font-size:.78em;padding:1px 5px;border-radius:3px;border:1px solid var(--pr-line);color:var(--pr-sub)}
.kr .kl em.nav{color:var(--pr-acc);border-color:#b7d4ef;background:#eef5fc}
.kr .kl em.ks{color:#6b7479;background:var(--pr-soft)}
.kr .kd{color:#343c41;line-height:1.5;margin-top:2px;word-break:keep-all}
.kr-none{color:#9aa4ab;padding:12px 0}
/* Core 설명 화면 — 요소 설명을 오른쪽 칸에 */
.elcol .er{margin:.6em 0;padding-bottom:.6em;border-bottom:1px solid var(--pr-line)}
.elcol .er:last-child{border-bottom:0}
/* 이어지는 장 — 남은 설명·소프트키를 두 단으로 */
.sheet.cont .sh-body{padding-top:14px}
.sheet.cont .sc-head{margin-bottom:10px}
.sc-chip.contchip{color:var(--pr-sub);border-color:var(--pr-line);background:var(--pr-soft)}
.cont-desc{column-count:2;column-gap:26px;margin-bottom:10px}
.cont-keys{column-count:2;column-gap:26px;font-size:12px}
.cont-keys .kr{break-inside:avoid}
/* 설명 페이지 */
.sc-slide{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center}
/* 표지 */
.sheet.cover{padding:0 72px}
.sheet.cover .sh-body{justify-content:center;padding:0}
.cv{border-left:4px solid var(--pr-acc);padding-left:28px}
.cv-sys{font-size:14px;color:var(--pr-sub);margin-bottom:10px}
.cv h1{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.2;margin-bottom:34px}
.cv-meta{border-collapse:collapse;font-size:13px}
.cv-meta th{text-align:left;color:var(--pr-sub);font-weight:500;padding:5px 26px 5px 0;white-space:nowrap}
.cv-meta td{padding:5px 0}
/* 목차 */
.toc{width:100%;border-collapse:collapse;font-size:12px}
.toc th{text-align:left;font-size:10px;letter-spacing:.1em;color:var(--pr-sub);font-weight:700;padding:0 8px 6px;border-bottom:1.5px solid var(--pr-ink)}
.toc td{padding:0 8px;height:23px;border-bottom:1px solid var(--pr-line)}
.toc tr.rs td{border-top:1.5px solid #9aa6ad}
.toc td.pg{font:700 11.5px/1 "D2 coding",Consolas,monospace;width:40px;color:var(--pr-acc)}
.toc td.mono{font-family:"D2 coding",Consolas,monospace;color:var(--pr-sub);width:70px}
.toc td:nth-child(2){width:110px;font-weight:600}
.toc .tw{font-style:normal;color:#b3bcc2;margin-right:6px}
</style>

/* 옛 파일을 열어도 빠진 필드를 채운다 — 마이그레이션은 전부 여기서 */

    ? normalizeStatus(d.core.status) : null;

/* --- 트리 질의 --- */
function pageById(id) { for (var i = 0; i < S.doc.pages.length; i++) if (S.doc.pages[i].id === id) return S.doc.pages[i]; return null; }
function pageIdx(id) { for (var i = 0; i < S.doc.pages.length; i++) if (S.doc.pages[i].id === id) return i; return -1; }
function keyNo(k) { return k ? num(k.slice(1), 99) : 99; }
function childrenOf(id) {
  return S.doc.pages.filter(function (p) { return (p.parent || null) === (id || null); })
    .sort(function (a, b) { return keyNo(a.viaKey) - keyNo(b.viaKey); });
}
function childAt(pageId, key) {

  return c[0] || null;
}

  return c[0] || null;
}
function pathOf(id) {

  while (p && guard++ < 99) { out.unshift(p); p = p.parent ? pageById(p.parent) : null; }
  return out;
}
function isDescendant(id, ancestor) {

  while (p && guard++ < 99) { if (p.id === ancestor) return true; p = p.parent ? pageById(p.parent) : null; }
  return false;
}

/* 화면 전체(1920×1080)를 쓰는 화면 : Core 설명, 설명 페이지 */

    return { label: 'GVA.' + id, role: '', state: k.state && k.state !== 'hidden' ? k.state : 'enable', desc: k.desc || '', child: null, ph: true };
  }

    (title ? '<h3>' + esc(title) + '</h3>' : '') + inner + '</section>';
}
function docViewPanel(p) {

  out.push(vsec('', '<div class="vhead">' +
    '<h2>' + esc(p.title) + '</h2>' +
    (p.desc ? '<p class="vdesc">' + esc(p.desc) + '</p>' : '') + '</div>', 'vfirst'));
  if (p.notes) out.push(vsec('발표 메모', '<div class="vnotes">' + esc(p.notes) + '</div>'));
  if (els.length) {
    out.push(vsec('항목', '<ul class="vlist">' + els.map(function (e) {
      return '<li class="vitem' + (S.sel.indexOf(e.id) >= 0 ? ' on' : '') + '" data-eid="' + e.id +
        '"><span class="vn">' + nums[e.id] + '</span><div><b>' + esc(e.name) + '</b>' +
        (e.desc ? '<p>' + esc(e.desc) + '</p>' : '') + '</div></li>';
    }).join('') + '</ul>'));

  if ((p.hist || []).length) {
    out.push(vsec('변경 이력', '<table class="vtbl">' + p.hist.map(function (x) {
      return '<tr><td>' + esc(x.d) + '</td><td>' + esc(x.w) + '</td><td>' + esc(x.t) + '</td></tr>';
    }).join('') + '</table>'));
  }
  out.push(vsec('', '<div class="vtip"><kbd>←</kbd> <kbd>→</kbd> 로 앞뒤 페이지를 넘깁니다.</div>'));
  return out.join('');
}
function viewPanel() {
  var p = curPage(), nums = docNums(p), out = [], i;
  if (p.sys === 'doc') return docViewPanel(p);
  var area = areaByKey(areaOf(p));
  var crumbs = pathOf(p.id).map(function (x) { return esc(x.title); }).join(' › ');

  /* 1. 개요 */
  out.push(vsec('', '<div class="vhead"><h2>' + esc(p.title) + '</h2>' +
    '<div class="vmeta">' + (area ? '<span class="vareatag">' + esc(area.key) + ' ' + esc(area.name) + '</span> ' : '') +
    crumbs + '</div>' +
    (p.desc ? '<p class="vdesc">' + esc(p.desc) + '</p>' : '') + '</div>', 'vfirst'));

  /* 2. F1~F12 */
  var keys = navIds().map(function (id) { return { id: id, k: effKey(p, id) }; })
    .filter(function (r) { return !r.k.ph && (r.k.state !== 'hidden' || S.ghost); });
  if (p.sys !== 'core' || keys.length) out.push(vsec('F1~F12 버튼', keys.length
    ? '<ul class="vlist">' + keys.map(function (r) {
        return '<li class="vitem k-' + r.k.state + '" data-key="' + r.id + '"' +
          (r.k.child ? ' data-to="' + r.k.child.id + '"' : '') + '>' +
          '<span class="vn mono">' + r.id + '</span><div>' +
          '<b>' + esc(r.k.label || '—') + '</b>' +
          (r.k.child ? ' <span class="rl nav">화면 이동</span>' : '') +
          (r.k.state !== 'enable' ? ' <span class="rl st">' + stKo(r.k.state) + '</span>' : '') +
          (r.k.desc ? '<p>' + esc(r.k.desc) + '</p>' : '') +
          '</div></li>';
      }).join('') + '</ul>'
    : '<div class="vempty">이 화면에는 배정된 버튼이 없습니다.</div>'));

  /* 3. 화면 요소 */
  var els = p.elements.filter(function (e) { return e.doc !== false; });
  if (els.length) {
    out.push(vsec(p.sys === 'core' ? 'Core 영역 구성' : '화면 요소',
      '<ul class="vlist">' + els.map(function (e) {
        return '<li class="vitem' + (S.sel.indexOf(e.id) >= 0 ? ' on' : '') + '" data-eid="' + e.id +
          '"><span class="vn">' + nums[e.id] + '</span>' +
          '<div><b>' + esc(e.name) + '</b>' + (e.desc ? '<p>' + esc(e.desc) + '</p>' : '') + '</div></li>';
      }).join('') + '</ul>'));
  }

  /* 4. 상세 설명 */
  if (p.notes) out.push(vsec('설명', '<div class="vnotes">' + esc(p.notes) + '</div>'));

  /* 5. 기능영역 8개 */
  var arows = (S.doc.areas || []).map(function (a, idx) {
    var e = effLabel(p, idx);
    return '<li class="vitem area ' + e.s + '" data-lbl="' + idx + '" data-area="' + esc(a.key) + '">' +
      '<span class="vn area">' + esc(a.key) + '</span><div>' +
      '<b>' + esc(a.name) + '</b> <span class="rl st">' +
      (e.s === 'selected' ? '선택' : a.use ? '활성' : '미실행') + '</span>' +
      (e.desc ? '<p>' + esc(e.desc) + '</p>' : '') + '</div></li>';
  }).join('');
  out.push(vsec('기능영역 (상단 물리 버튼 8개)', '<ul class="vlist">' + arows + '</ul>' +
    '<div class="vnote">기능영역 1개 = HMI Application 1개 (1:1). 현재 화면이 속한 기능영역이 선택 상태로 표시된다.</div>'));

  /* 6. F13~F20 */
  out.push(vsec('F13~F20 공통 버튼 (GVA 규정)',
    '<ul class="vlist tight">' + BOTTOM_IDS.slice(0, S.doc.core.bottom.count).map(function (id) {
      var b = effBottom(p, id), t = bottomTarget(p, id);
      return '<li class="vitem k-' + b.state + '" data-key="' + id + '"' +
        (t ? ' data-to="' + t.id + '"' : '') + '>' +
        '<span class="vn mono">' + id + '</span><div>' +
        '<b>' + esc(b.label) + '</b>' +
        (b.state !== 'enable' ? ' <span class="rl st">' + stKo(b.state) + '</span>' : '') +
        '<p>' + esc(b.desc || b.fn) + '</p>' +
        (t ? '<span class="vgo">→ ' + esc(t.title) + '</span>' : '') +
        '</div></li>';
    }).join('') + '</ul>'));

  /* 7. 변경 이력 */
  if ((p.hist || []).length) {
    out.push(vsec('변경 이력', '<table class="vtbl">' + p.hist.map(function (x) {
      return '<tr><td>' + esc(x.d) + '</td><td>' + esc(x.w) + '</td><td>' + esc(x.t) + '</td></tr>';
    }).join('') + '</table>'));
  }
  return out.join('');
}
/* 남는 높이에 맞춰 섹션을 나눠 담고 1 / N 페이저를 붙인다 */
function paginateSide() {
  var body = $('#inspBody'), pager = $('#sidePager');
  if (!body || !pager) return;
  if (S.mode === 'edit') { pager.style.display = 'none'; return; }
  var secs = $$('.vsec', body);
  if (!secs.length) { pager.style.display = 'none'; return; }
  secs.forEach(function (s) { s.style.display = ''; });
  var avail = (body.clientHeight || 0) - 16, pages = [], cur = [], h = 0;
  if (avail > 120) {
    secs.forEach(function (s, i) {
      var hh = (s.offsetHeight || 0) + 14;
      if (cur.length && h + hh > avail) { pages.push(cur); cur = []; h = 0; }
      cur.push(i); h += hh;
    });
    if (cur.length) pages.push(cur);
  } else {
    pages = [secs.map(function (_, i) { return i; })];
  }
  if (S.sideJump) {                             /* 방금 고른 요소의 설명이 있는 쪽으로 */
    S.sideJump = false;
    var onItem = $('.vitem.on', body), onSec = onItem ? onItem.closest('.vsec') : null, si = secs.indexOf(onSec);
    if (si >= 0) pages.forEach(function (pg, pi) { if (pg.indexOf(si) >= 0) S.sidePage = pi; });
  }
  if (S.sidePage >= pages.length) S.sidePage = pages.length - 1;
  if (!(S.sidePage >= 0)) S.sidePage = 0;
  var show = pages[S.sidePage] || [];
  secs.forEach(function (s, i) { s.style.display = show.indexOf(i) >= 0 ? '' : 'none'; });
  pager.style.display = pages.length > 1 ? '' : 'none';
  $('#sidePageNo').textContent = (S.sidePage + 1) + ' / ' + pages.length;
  $('#sidePrev').disabled = S.sidePage === 0;
  $('#sideNext').disabled = S.sidePage >= pages.length - 1;
  var vis = $('.vitem.on', body);
  if (vis && vis.scrollIntoView && vis.offsetParent) vis.scrollIntoView({ block: 'nearest' });
}

/* ---------- 편집 모드 : 입력 도우미 ---------- */
function bindRoot(path) {
  var ps = path.split('.'), root = ps.shift(), obj = null;
  if (root === 'doc') obj = S.doc;
  else if (root === 'core') obj = S.doc.core;
  else if (root === 'areas') obj = S.doc.areas;
  else if (root === 'roles') obj = S.doc.roles;
  else if (root === 'page') obj = curPage();
  else if (root === 'el') obj = elOf(curPage(), S.sel[0]);
  return { obj: obj, path: ps.join('.') };
}
function pageOptions(sel, emptyText, excludeSub) {
  var out = emptyText ? '<option value="">' + esc(emptyText) + '</option>' : '';
  S.doc.pages.forEach(function (p) {
    if (excludeSub && isDescendant(p.id, excludeSub)) return;
    out += '<option value="' + p.id + '"' + (p.id === sel ? ' selected' : '') + '>' +
      new Array(depthOf(p) + 1).join('   ') + esc(p.title) + '</option>';
  });
  return out;
}
function selOptions(csv, sel, labels) {
  return csv.split(',').map(function (v, i) {
    return '<option value="' + esc(v) + '"' + (String(sel) === v ? ' selected' : '') + '>' +
      esc(labels && labels[i] ? labels[i] : (v || '(없음)')) + '</option>';
  }).join('');
}
function fld(label, bind, kind, val, o) {
  o = o || {};
  var inp;
  if (kind === 'area') {
    inp = '<textarea data-b="' + bind + '" rows="' + (o.rows || 3) + '" placeholder="' + esc(o.ph || '') + '">' + esc(val) + '</textarea>';
  } else if (kind === 'num') {
    inp = '<input type="number" data-b="' + bind + '" value="' + esc(val) + '" step="' + (o.step || 1) + '">';
  } else if (kind === 'color') {
    inp = '<input type="color" data-b="' + bind + '" value="' + esc(val || '#000000') + '">';
  } else if (kind === 'check') {
    return '<div class="f col"><label class="chk"><input type="checkbox" data-b="' + bind + '"' +
      (val ? ' checked' : '') + '>' + esc(o.text || '') + '</label></div>';
  } else if (kind === 'page') {
    inp = '<select data-b="' + bind + '">' + pageOptions(val, o.ph || '(없음)', o.excludeSub) + '</select>';
  } else if (kind.indexOf('sel:') === 0) {
    inp = '<select data-b="' + bind + '">' + selOptions(kind.slice(4), val, o.labels) + '</select>';
  } else {
    inp = '<input type="text" data-b="' + bind + '" value="' + esc(val) + '" placeholder="' + esc(o.ph || '') + '">';
  }
  return '<div class="f' + (o.col ? ' col' : '') + '"><label>' + esc(label) + '</label>' + inp + '</div>';
}
function fs(title, inner, open) {
  return '<details class="fs"' + (open === false ? '' : ' open') + '><summary>' + esc(title) + '</summary>' +
    '<div class="in">' + inner + '</div></details>';
}
function num4(label, bind, r, names) {
  return '<div class="f col"><label>' + esc(label) + '</label><div class="f4">' +
    r.map(function (v, i) {
      return '<span class="u"><input type="number" data-b="' + bind[i] + '" value="' + v + '"><span>' +
        names[i] + '</span></span>';
    }).join('') + '</div></div>';
}

/* 상위 화면 선택지 — 자기 자신·자기 하위·설명 페이지는 뺀다. 맨 위는 "최상위" */
function parentOptions(p) {
  var out = '<option value="">(최상위 — ' + esc(areaName(areaOf(p))) + ')</option>';
  orderedPages().forEach(function (q) {
    if (q.id === p.id || q.sys === 'doc' || isDescendant(q.id, p.id)) return;
    out += '<option value="' + q.id + '"' + (q.id === p.parent ? ' selected' : '') + '>' +
      new Array(depthOf(q) + 1).join('\u00A0\u00A0\u00A0') + esc(q.title) + '</option>';
  });
  return out;
}

/* ---------- 소프트키 탭 ---------- */
function tabKey() {
  var p = curPage(), h = '';
  if (p.sys === 'doc') return '<div class="hint">설명 페이지에는 버튼이 없습니다.</div>';
  h += '<div class="hint" style="margin-bottom:10px"><b>F1~F12 는 이 화면 전용</b>입니다. ' +
    '화면을 연결하면 그 버튼은 <b>화면 이동</b> 버튼이 되고, 라벨을 비우면 연결한 화면 제목을 씁니다. ' +

/* ---------- 전시기 탭 ---------- */
/* ---------- 다른 전시기로 화면 보내기 (복사 / 이동) ----------
   지금 화면과 그 하위 화면 전부를 보낸다(id 는 새로 매긴다).
   · 대상 전시기에 상위 화면들의 제목 경로가 같은 화면이 있으면 그 밑에 붙인다
     (같은 F키가 비어 있으면 그 키, 차 있으면 빈 키)
   · 없으면 같은 기능영역의 최상위 화면이 된다
   · Core·알람·위협 특수 화면은 대상에 이미 있으면 보통 화면으로 들어간다 (전시기마다 하나씩) */
function titlePath(pages, p) {
  var byId = {}, out = [], g = 0;
  pages.forEach(function (q) { byId[q.id] = q; });
  while (p && g++ < 99) { out.unshift(p.title); p = p.parent ? byId[p.parent] : null; }
  return out.join('');
}
function roleById(id) { return S.doc.roles.filter(function (r) { return r.id === id; })[0] || null; }
function sendPage(roleId, move, pageId) {
  syncRole();
  var src = activeRole(), dst = roleById(roleId), cur = pageById(pageId || S.cur);
  if (!dst || dst === src || !cur) return;
  var tree = S.doc.pages.filter(function (p) { return p.id === cur.id || isDescendant(p.id, cur.id); });
  if (move && tree.length >= S.doc.pages.length) { toast('전시기에 화면이 하나는 남아야 합니다 — 복사를 쓰세요'); return; }
  var copies = clonePages(tree), root = copies[tree.indexOf(cur)], area = areaOf(cur), par = null, where, demoted = 0;
  if (cur.parent) {
    var want = titlePath(S.doc.pages, pageById(cur.parent));
    par = dst.pages.filter(function (q) { return q.sys !== 'doc' && titlePath(dst.pages, q) === want; })[0] || null;
  }
  if (par) {
    var used = {};
    dst.pages.forEach(function (q) { if (q.parent === par.id) used[q.viaKey] = 1; });
    var key = !used[cur.viaKey] ? cur.viaKey : navIds().filter(function (k) { return !used[k]; })[0];
    if (key) { root.parent = par.id; root.viaKey = key; root.area = ''; where = '"' + par.title + '" 의 ' + key; }
    else par = null;
  }
  if (!par) {
    root.parent = null; root.viaKey = '';
    root.area = cur.sys === 'doc' ? '' : area;
    where = cur.sys === 'doc' ? '설명 페이지' : area ? area + ' 최상위' : '공통 화면';
  }
  copies.forEach(function (c) {
    if (c.sys && c.sys !== 'doc' && dst.pages.some(function (q) { return q.sys === c.sys; })) { c.sys = ''; demoted++; }
  });
  dst.pages = dst.pages.concat(copies);
  var dstArea = (dst.areas || []).filter(function (x) { return x.key === area; })[0];
  if (move) {
    var gone = {};
    tree.forEach(function (p) { gone[p.id] = 1; });
    S.doc.pages = S.doc.pages.filter(function (p) { return !gone[p.id]; });
    syncRole();
    S.cur = cur.parent && pageById(cur.parent) ? cur.parent : S.doc.pages[0].id;
    S.nav = []; S.sel = [];
  }
  commit(); renderAll();
  toast('"' + cur.title + '"' + (tree.length > 1 ? ' 외 하위 ' + (tree.length - 1) + '개' : '') + ' → ' + dst.name + ' ' + where +
    (move ? ' 로 이동' : ' 에 복사 (같은 ID 라 내용이 동기화됨)') + (demoted ? ' (특수 화면은 이미 있어 보통 화면으로)' : '') +
    (dstArea && !dstArea.use ? ' — ' + area + ' 는 ' + dst.name + '에서 미실행 상태입니다' : ''));
}

function bindElDnD(body) {

    var t = e.target.closest('.eitem');
    if (!t || from === null) return;

    $$('.eitem', body).forEach(function (x) { x.classList.remove('drag-over'); });

function boot() {
  var raw = ($('#hmi-data').textContent || '').trim(), data = null;
  try { data = JSON.parse(raw); } catch (e) { data = null; }
  S.doc = normalize(data && (data.pages || data.roles) ? data : demoDoc());
  S.cur = S.doc.pages[0].id;
  var byHash = findByCode(location.hash.slice(1));
  if (byHash) S.cur = byHash.id;
  S.ghost = false;
  S.sidePage = 0;
  S.snap = snapOf(S.doc);
  $('#docTitle').value = S.doc.meta.title;
  bindUI(); bindStage(); bindKeys();
  syncUndoBtns();
  setMode(S.doc.meta.openMode === 'edit' ? 'edit' : 'view');
}
